services:
  dev:
    build:
      context: .
    init: true
    user: root
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      TERM: xterm-256color
      COLORTERM: truecolor
    volumes:
      - type: bind
        source: ${DAM_WORKSPACE_PATH:?Use ./dam WORKSPACE COMMAND to select a workspace}
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: ${DAM_HOST_SETTINGS_PATH:?Use ./dam WORKSPACE COMMAND to select host settings}
        target: /mnt/host-settings
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: dev-home
        target: /home
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/dam-ready"]
      interval: 2s
      timeout: 2s
      retries: 15
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETUID
      - SETGID

volumes:
  dev-home:
