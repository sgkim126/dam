services:
  dev:
    build:
      context: .
    init: true
    user: node
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      TERM: xterm-256color
      COLORTERM: truecolor
      GH_CONFIG_DIR: /home/node/.config/gh
      GLAB_CONFIG_DIR: /home/node/.config/glab-cli
    volumes:
      - type: bind
        source: ${DAM_WORKSPACE_PATH:?Use ./dam WORKSPACE COMMAND to select a workspace}
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: ./.host-settings
        target: /mnt/host-settings
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: dev-home
        target: /home/node
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/dam-ready"]
      interval: 2s
      timeout: 2s
      retries: 15
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  dev-home:
