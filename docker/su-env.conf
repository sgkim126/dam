# Resolve account paths before running any target shell, including su -c.
# Keep these values aligned with /etc/profile.d/dam.sh.
HOME OVERRIDE=@{HOME}
USER OVERRIDE=@{PAM_USER}
LOGNAME OVERRIDE=@{PAM_USER}
SHELL OVERRIDE=@{SHELL}
XDG_CONFIG_HOME OVERRIDE=@{HOME}/.config
XDG_CACHE_HOME OVERRIDE=@{HOME}/.cache
XDG_DATA_HOME OVERRIDE=@{HOME}/.local/share
XDG_STATE_HOME OVERRIDE=@{HOME}/.local/state
CODEX_HOME OVERRIDE=@{HOME}/.codex
GH_CONFIG_DIR OVERRIDE=@{HOME}/.config/gh
GLAB_CONFIG_DIR OVERRIDE=@{HOME}/.config/glab-cli
NPM_CONFIG_PREFIX OVERRIDE=@{HOME}/.local
PATH OVERRIDE=@{HOME}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
LANG OVERRIDE=C.UTF-8
LC_ALL OVERRIDE=C.UTF-8
EDITOR OVERRIDE=nvim
VISUAL OVERRIDE=nvim
