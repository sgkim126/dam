[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dam"
version = "0.1.0"
description = "Persistent Docker workspaces with shared shell profiles"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dam = "dam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dam = ["resources/container/*", "resources/container/.dockerignore", "resources/container/docker/*"]

[tool.uv]
required-version = ">=0.13.1"

[tool.ruff]
target-version = "py311"
line-length = 88
include = ["*.py", "*.pyi", "*.ipynb"]

[dependency-groups]
dev = [
    "ruff==0.17.1",
]
