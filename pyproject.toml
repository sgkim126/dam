[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dam"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
required-version = ">=0.13.1"
package = false

[dependency-groups]
dev = [
    "ruff==0.17.1",
]

[tool.ruff]
target-version = "py311"
line-length = 88
include = ["*.py", "*.pyi", "*.ipynb"]
